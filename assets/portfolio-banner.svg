<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" role="img" aria-labelledby="title desc">
  <title id="title">Christian Talavera — infrastructure engineering portfolio</title>
  <desc id="desc">A dark editor-inspired banner with a Git-to-ARM64 delivery path. Select it to visit the portfolio.</desc>
  <defs>

      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#91b8e7" stroke-opacity=".065"/>
